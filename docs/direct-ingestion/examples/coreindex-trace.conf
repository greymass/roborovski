# coreindex writing core storage and the ABI cache from nodeos trace files (trace ingestion).
# stride must equal the trace nodeos's trace-slice-stride.

index-storage = /data/roborovski/core
abi-source = /data/roborovski/core/abis
chain-id = <64 hex characters>
trace-dir = /data/nodeos/traces
stride = 10000
zstd = true
zstd-level = 3
workers = 16
prefetchers = 4

http-listen = 127.0.0.1:9400
http-socket = /run/roborovski/coreindex.sock
stream-listen = 127.0.0.1:9401
stream-socket = /run/roborovski/corestream.sock
metrics-listen = 127.0.0.1:9402

# The log directory must exist before coreindex starts.
log-file = /var/log/roborovski/coreindex.log
