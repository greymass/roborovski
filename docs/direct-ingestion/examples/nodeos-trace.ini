# trace_api settings for a nodeos built with the Roborovski trace patch (trace ingestion).
# The rest of the history node's config.ini is the same as for direct ingestion, without the roborovski-writer options.

plugin = eosio::trace_api_plugin
trace-dir = /data/nodeos/traces
trace-slice-stride = 10000
trace-no-abis = true
trace-minimum-irreversible-history-blocks = -1
