name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work

      - name: Check workspace is tidy
        run: |
          make tidy
          git diff --exit-code || (echo "go.mod/go.sum files are not tidy — run 'make tidy' locally" && exit 1)

      - run: make test
